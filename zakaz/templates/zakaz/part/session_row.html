{% load static mytags l10n %}
<div class="bg-body-secondary sticky-top">
    <div class="d-flex justify-content-between p-1">
        <span>
            {{ses_name}}
            <span>
                {% if 'ses' not in request.GET or not request.GET.ses %}
                  <a href="{% querystring ses=ses_name %}" title="Показать только эту съемку">
                    <i class="bi bi-funnel"></i>
                  </a>
                {% else %}
                    <a href="{% querystring ses=None %}" title="Убрать фильтр по съемке">
                      <i class="bi bi-x-circle-fill"></i>
                    </a>
                {% endif %}
            </span>
        </span>
        <span>{{ses_data.ordered}} / {{ses_data.blanks}}</span>
    </div>
</div>
